<div class="page-wrapper">
  <header class="content">
    
    <div class="left-container">
      <img
        [src]="shapeImageSrc"
        alt=""
        aria-hidden="true"
        class="shape-image"
        (mouseenter)="onShapeMouseEnter()"
        (mouseleave)="onShapeMouseLeave()"
      />
      <img src="gaetano/gaetano.png" alt="Portrait von Gaetano Leanza" class="gaetano-image" />
    </div>

    <div class="right-container">
      <div class="top-section">
        <div class="top-section-left"></div>

        <div class="top-section-middle">
          <div class="logo-wrapper">
            <img src="img/logos/Logo 1.png" alt="G.Leanza Logo Teil 1" class="logo-image" />
            <img src="img/logos/Logo 2.png" alt="G.Leanza Logo Teil 2" class="logo-image2" />
            <div class="name-logo" aria-hidden="true">G.Leanza</div>
            <div class="text-logo" aria-hidden="true">developer</div>
          </div>

          <div class="top-section-right-mobile">
            <button 
              type="button"
              class="burger-menu unstyled-button" 
              (click)="toggleMobileMenu()"
              [attr.aria-expanded]="isMobileMenuOpen"
              aria-label="Mobiles Menü umschalten"
            >
              <div class="bar" aria-hidden="true"></div>
              <div class="bar" aria-hidden="true"></div>
              <div class="bar" aria-hidden="true"></div>
            </button>
          </div>
        </div>

        <nav class="top-section-right" aria-label="Social Media und Kontakt">
          <button 
            type="button" 
            class="unstyled-button" 
            aria-label="Kontakt per Email" 
            (click)="navigateTo('contact')"
            (mouseenter)="onEmailMouseEnter()"
            (mouseleave)="onEmailMouseLeave()"
          >
            <img [src]="emailImageSrc" alt="" class="email-image" />
          </button>
          
          <button 
            type="button" 
            class="unstyled-button" 
            aria-label="GitHub Profil öffnen" 
            (click)="openGitHub()"
            (mouseenter)="onGithubMouseEnter()"
            (mouseleave)="onGithubMouseLeave()"
          >
            <img [src]="githubImageSrc" alt="" class="github-image" />
          </button>
          
          <button 
            type="button" 
            class="unstyled-button" 
            aria-label="LinkedIn Profil öffnen" 
            (click)="openLinkedIn()"
            (mouseenter)="onLinkedinMouseEnter()"
            (mouseleave)="onLinkedinMouseLeave()"
          >
            <img [src]="linkedinImageSrc" alt="" class="linkedin-image" />
          </button>
        </nav>
      </div>

      <div class="middle-section">
        <img
          *ngIf="!isMobileMenuOpen"
          src="gaetano/gaetano responsive.png"
          alt="Portrait von Gaetano Leanza"
          class="gaetano-image-responsive"
        />
        <img
          *ngIf="isMobileMenuOpen"
          src="img/hero section/shape.png"
          alt=""
          aria-hidden="true"
          class="shape-image-class"
        />

        <div class="centered-mobile-nav" *ngIf="isMobileMenuOpen">
          <nav class="mobile-nav-content" aria-label="Mobile Navigation">
            <button type="button" class="why-me unstyled-button" (click)="navigateTo('why-me')">
              {{ "whyMe" | translate }}
            </button>
            <button type="button" class="skills unstyled-button" (click)="navigateTo('skills')">
              {{ "skills" | translate }}
            </button>
            <button type="button" class="project unstyled-button" (click)="navigateTo('project')">
              {{ "project" | translate }}
            </button>
            <button type="button" class="contact unstyled-button" (click)="navigateTo('contact')">
              {{ "contact" | translate }}
            </button>

            <div class="bottom-container-mobile">
              <div class="bottom-container-mobile-button1">
                <button type="button" class="unstyled-button" aria-label="Sprache auf Deutsch wechseln" (click)="switchLanguage('de')">
                  <img [src]="getImageSrc('de')" alt="" class="language-button german-image" />
                </button>
              </div>

              <div class="bottom-container-mobile-button2">
                <button type="button" class="unstyled-button" aria-label="Switch language to English" (click)="switchLanguage('en')">
                  <img [src]="getImageSrc('en')" alt="" class="language-button english-image" />
                </button>
              </div>
            </div>
          </nav>
        </div>

        <h1 class="name">Gaetano Leanza</h1>
        <h2 class="title">FULLSTACK DEVELOPER</h2>
        <div class="title2">DevSecOps</div>
      </div>

      <div class="bottom-section">
        <button 
          type="button" 
          class="unstyled-button" 
          aria-label="Nach unten scrollen"
          (click)="navigateTo('why-me')"
          (mouseenter)="onArrowMouseEnter()"
          (mouseleave)="onArrowMouseLeave()"
        >
          <img [src]="arrowImageSrc" alt="" class="arrow-image" />
        </button>
      </div>
    </div>
  </header>

  <div class="header-spacer"></div>

  <nav class="bottom-container" [class.sticky]="isHeaderSticky" aria-label="Hauptnavigation">
    <div class="bottom-container-left">
      <div class="logo-wrapper2">
        <img src="img/logos/Logo dark mob.png" alt="G.Leanza Logo dunkel" />
        <div class="name-logo" aria-hidden="true">G.Leanza</div>
        <div class="text-logo-dark" aria-hidden="true">developer</div>
      </div>
    </div>

    <div class="bottom-container-middle">
      <button type="button" class="why-me unstyled-button" (click)="navigateTo('why-me')">
        {{ "whyMe" | translate }}
      </button>
      <button type="button" class="skills unstyled-button" (click)="navigateTo('skills')">
        {{ "skills" | translate }}
      </button>
      <button type="button" class="project unstyled-button" (click)="navigateTo('project')">
        {{ "project" | translate }}
      </button>
      <button type="button" class="contact unstyled-button" (click)="navigateTo('contact')">
        {{ "contact" | translate }}
      </button>
    </div>

    <div class="bottom-container-right">
      <div class="bottom-container-mobile-button1">
        <button type="button" class="unstyled-button" aria-label="Sprache auf Deutsch wechseln" (click)="switchLanguage('de')">
          <img [src]="getImageSrc('de')" alt="" class="language-button german-image" />
        </button>
      </div>

      <div class="bottom-container-mobile-button2">
        <button type="button" class="unstyled-button" aria-label="Switch language to English" (click)="switchLanguage('en')">
          <img [src]="getImageSrc('en')" alt="" class="language-button english-image" />
        </button>
      </div>
    </div>
  </nav>
</div>
